[project]
name = "aspen-plus-mcp"
version = "1.0.0"
description = "MCP server for Aspen Plus V15 — process simulation in natural language, with RadFrac Column Internals (trays, packing, hydraulics, column height)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Eduardo Mariola"},
]
keywords = ["aspen-plus", "mcp", "process-simulation", "chemical-engineering", "com-automation",
            "distillation", "column-internals", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]
dependencies = [
    "fastmcp>=1.0.0",
    "pywin32>=306",
]

[project.urls]
Homepage = "https://github.com/Eduardo-Mariola/aspen-plus-mcp"
Repository = "https://github.com/Eduardo-Mariola/aspen-plus-mcp"
Documentation = "https://github.com/Eduardo-Mariola/aspen-plus-mcp#readme"
Upstream = "https://github.com/thirakorn-mokkawes-59/aspen-mcp"

[project.scripts]
aspen-mcp = "aspen_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
